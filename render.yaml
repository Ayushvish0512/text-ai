services:
  - type: web
    name: tiny-llm-api
    env: python
    plan: free
    region: oregon
    buildCommand: |
      pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
    
    healthCheckPath: /
