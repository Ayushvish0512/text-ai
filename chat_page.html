<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Text-AI Chat</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; background:#0b1020; color:#e8eefc; }
    .wrap { max-width: 900px; margin: 0 auto; }
    h1 { margin: 0 0 12px; font-size: 18px; }
    .chat { border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 12px; height: 60vh; overflow:auto; background: rgba(255,255,255,0.03); }
    .msg { margin: 10px 0; }
    .role { font-weight: 700; font-size: 12px; opacity: 0.9; }
    .bubble { white-space: pre-wrap; margin-top: 4px; padding: 10px 12px; border-radius: 12px; background:#141a33; border:1px solid rgba(255,255,255,0.08); }
    .user .bubble { background:#15314d; }
    .controls { display:flex; gap: 8px; margin-top: 12px; }
    textarea { flex:1; padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color:#e8eefc; min-height: 42px; resize:none; }
    button { padding:10px 14px; border-radius:10px; border:0; cursor:pointer; background:#4f7cff; color:white; font-weight:700; }
    button:disabled { opacity:0.6; cursor:not-allowed; }
    .status { margin-top: 8px; opacity:0.8; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Tiny LLM Chat</h1>
    <div id="chat" class="chat" aria-live="polite"></div>

    <div class="controls">
      <textarea id="input" placeholder="Type your message..." ></textarea>
      <button id="send">Send</button>
    </div>
    <div id="status" class="status"></div>
  </div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const statusEl = document.getElementById('status');

  function addMsg(role, text){
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (role === 'user' ? 'user' : 'bot');

    const roleEl = document.createElement('div');
    roleEl.className = 'role';
    roleEl.textContent = role === 'user' ? 'You' : 'Bot';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    wrap.appendChild(roleEl);
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  async function generateStream(text, onChunk){
    const res = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, max_length: 150 })
    });

    if(!res.ok){
      const t = await res.text();
      throw new Error('HTTP ' + res.status + ': ' + t);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');

    while(true){
      const { value, done } = await reader.read();
      if(done) break;
      const chunk = decoder.decode(value, { stream: true });
      if(chunk) onChunk(chunk);
    }
  }

  async function onSend(){
    const text = input.value.trim();
    if(!text) return;

    addMsg('user', text);
    input.value = '';
    send.disabled = true;
    statusEl.textContent = 'Generating...';

    // Create bot bubble immediately and append streamed chunks
    const wrap = document.createElement('div');
    wrap.className = 'msg bot';

    const roleEl = document.createElement('div');
    roleEl.className = 'role';
    roleEl.textContent = 'Bot';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = '';

    wrap.appendChild(roleEl);
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;

    try{
      await generateStream(text, (chunk) => {
        bubble.textContent += chunk;
        chat.scrollTop = chat.scrollHeight;
      });
      statusEl.textContent = '';
    }catch(e){
      bubble.textContent = 'Error: ' + e.message;
      statusEl.textContent = '';
    }finally{
      send.disabled = false;
    }
  }

  send.addEventListener('click', onSend);
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      onSend();
    }
  });
</script>
</body>
</html>
